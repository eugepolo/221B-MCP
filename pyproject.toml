[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "221b-mcp"
version = "0.1.0"
description = "Local MCP tools for public-source investigations with traceable evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6,<26",
  "ddgs>=9.16,<10",
  "mcp>=1.30,<2",
  "httpx>=0.28,<1",
  "httpcore>=1.0.9,<2",
  "beautifulsoup4>=4.13,<5",
  "dnspython>=2.7,<3",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
sherlock = ["sherlock-project>=0.16,<0.17"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
221b-mcp = "mcp_221b.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_221b"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
